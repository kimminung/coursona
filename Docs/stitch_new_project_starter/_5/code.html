      const x = (e.clientX / innerWidth - 0.5) * 16;
      const y = (e.clientY / innerHeight - 0.5) * 12;
      if (mirrorBust) {
        mirrorBust.style.transform = `translate3d(${x}px, ${y}px, 0) rotateY(${x * 0.8}deg) rotateX(${-y * 0.8}deg)`;

    // PiP Show / Hide Toggle
    function togglePip() {
      const pip = document.getElementById('pipContainer');
      const icon = document.getElementById('pipIcon');
      if (pip.classList.contains('hidden')) {
        pip.classList.remove('hidden');
        icon.innerText = 'videocam';
        icon.classList.remove('text-outline');
        icon.classList.add('text-primary');
      } else {
        pip.classList.add('hidden');
        icon.innerText = 'videocam_off';
        icon.classList.remove('text-primary');
        icon.classList.add('text-outline');

    let micActive = true;

      const icon = document.getElementById('micIcon');

        btn.classList.add('text-on-surface');

        btn.classList.add('text-outline');
